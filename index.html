<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FormCraft • Criador de Formulários</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar glass">
        <div class="brand">
          <span class="logo">◆</span>
          <div>
            <h1>FormCraft Studio</h1>
            <p>Crie formulários modernos em minutos</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="saveTemplateBtn" class="btn btn-secondary">Salvar modelo</button>
          <button id="publishBtn" class="btn btn-primary">Publicar formulário</button>
        </div>
      </header>

      <main class="layout">
        <aside class="panel glass controls-panel">
          <h2>Configurações</h2>
          <form id="formSettings" class="stack">
            <label>
              Título do formulário
              <input id="formTitle" type="text" value="Cadastro de Evento" maxlength="100" />
            </label>
            <label>
              Descrição
              <textarea id="formDescription" rows="3" maxlength="250">Preencha os dados abaixo para participar do evento.</textarea>
            </label>
            <label>
              Cor principal
              <input id="primaryColor" type="color" value="#5b67f1" />
            </label>

            <div>
              <h3>Adicionar campo</h3>
              <div class="field-actions">
                <button type="button" class="btn btn-chip" data-type="text">Texto</button>
                <button type="button" class="btn btn-chip" data-type="email">E-mail</button>
                <button type="button" class="btn btn-chip" data-type="number">Número</button>
                <button type="button" class="btn btn-chip" data-type="date">Data</button>
                <button type="button" class="btn btn-chip" data-type="select">Seleção</button>
                <button type="button" class="btn btn-chip" data-type="textarea">Parágrafo</button>
                <button type="button" class="btn btn-chip" data-type="file">Anexo</button>
              </div>
            </div>
          </form>

          <section class="field-editor" id="fieldEditor">
            <h3>Edição personalizada</h3>
            <p>Selecione um campo no preview para personalizá-lo.</p>
          </section>
        </aside>

        <section class="panel preview-panel">
          <div class="preview-header">
            <h2>Preview responsivo</h2>
            <div class="device-toggle">
              <button class="btn btn-icon active" data-device="desktop">Desktop</button>
              <button class="btn btn-icon" data-device="tablet">Tablet</button>
              <button class="btn btn-icon" data-device="mobile">Mobile</button>
            </div>
          </div>

          <div class="preview-wrapper" id="previewWrapper">
            <form id="formPreview" class="form-preview glass"></form>
          </div>
        </section>
      </main>
    </div>

    <template id="emptyStateTemplate">
      <div class="empty-state">
        <h3>Nenhum campo adicionado</h3>
        <p>Use os botões ao lado para começar a montar seu formulário.</p>
      </div>
    </template>

    <script src="script.js"></script>
  </body>
</html>
